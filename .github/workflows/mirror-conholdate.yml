name: Mirror to conholdate

# Pushes from a laptop trigger this. Records commits pushed by the BlogCaster
# workflows use GITHUB_TOKEN and don't trigger it; those workflows mirror
# themselves in their "Mirror to conholdate/blog-caster" step.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-conholdate
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to conholdate/blog-caster
        env:
          CONHOLDATE_PUSH_TOKEN: ${{ secrets.CONHOLDATE_PUSH_TOKEN }}
        run: |
          if [ -z "$CONHOLDATE_PUSH_TOKEN" ]; then
            echo "::error::CONHOLDATE_PUSH_TOKEN not set"
            exit 1
          fi
          MIRROR="https://x-access-token:${CONHOLDATE_PUSH_TOKEN}@github.com/conholdate/blog-caster.git"
          git fetch "$MIRROR" main:refs/remotes/mirror/main
          if git merge-base --is-ancestor HEAD refs/remotes/mirror/main; then
            echo "conholdate already has this commit, nothing to do"
            exit 0
          fi
          git push "$MIRROR" HEAD:main
